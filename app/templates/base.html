<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}PingTag{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; --bg:#fff; --fg:#111; --muted:#666; --accent:#2557d6; --on-accent:#fff; --border:#c8c8c8; --error:#c62828; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#121212; --fg:#eee; --muted:#aaa; --accent:#7aa2ff; --on-accent:#111; --border:#3a3a3a; --error:#ff8a80; }
    }
    body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width:28rem; margin:0 auto; padding:2rem 1rem; }
    a { color:var(--accent); }
    label { display:block; margin-top:1rem; font-weight:600; }
    input, select, textarea, button { width:100%; box-sizing:border-box; min-height:44px; font:inherit; padding:.5rem .75rem; border-radius:8px; }
    input, select, textarea { border:1px solid var(--border); background:transparent; color:inherit; }
    button { border:0; background:var(--accent); color:var(--on-accent); margin-top:.75rem; cursor:pointer; }
    button.secondary, .button.secondary { background:transparent; color:var(--fg); border:1px solid var(--border); }
    button.danger { background:var(--error); color:#fff; }
    .button { display:block; text-align:center; box-sizing:border-box; min-height:44px; line-height:44px; padding:0 .75rem; margin-top:.75rem; border-radius:8px; background:var(--accent); color:var(--on-accent); text-decoration:none; }
    .button.secondary { line-height:42px; }
    .nav { display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; }
    .nav form { margin:0; }
    .nav button { width:auto; margin:0; min-height:36px; }
    .card { display:block; border:1px solid var(--border); border-radius:12px; padding:.75rem 1rem; margin:.75rem 0; color:inherit; text-decoration:none; }
    .badge { display:inline-block; font-size:.8rem; padding:0 .5rem; border:1px solid var(--border); border-radius:999px; color:var(--muted); }
    details { border:1px solid var(--border); border-radius:8px; padding:.5rem .75rem; margin-top:.75rem; }
    summary { cursor:pointer; min-height:32px; }
    .qr { display:block; width:min(100%, 260px); margin:1rem auto; background:#fff; border-radius:8px; }
    .error { color:var(--error); }
    .muted { color:var(--muted); }
    code { word-break:break-all; }
  </style>
</head>
<body>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
